name: Capturas de proyectos
on:
  workflow_dispatch:
  push:
    branches: [portfolio-nuevo]
    paths: [tools/shots.js, .github/workflows/shots.yml]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/shots.js
      - name: Subir capturas a la rama capturas
        run: |
          cd shots/raw
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Capturas"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas

name: Capturas de proyectos
on:
  workflow_dispatch:
  push:
    branches: [portfolio-nuevo]
    paths: [tools/shots.js, .github/workflows/shots.yml]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/shots.js
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots/raw }
